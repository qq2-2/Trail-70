<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porsche Preloader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: Helvetica, Arial, sans-serif; background: #111; }

  /* ===== PRELOADER OVERLAY ===== */
  #preloader {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 9999;
    overflow: hidden;
  }

  /* Porsche label top-left */
  #brand {
    position: absolute;
    top: 5vh;
    left: 5vw;
    z-index: 2;
    color: #fff;
    font-size: clamp(18px, 2.5vw, 32px);
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  /* ===== FULLSCREEN CAR IMAGE ===== */
  #car-wrap {
    position: absolute;
    inset: 0;
  }

  #car-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;          /* fills entire screen */
    object-position: 40% 60%;   /* keeps the headlight nicely in frame */
    display: block;
  }

  /* ===== HEADLIGHT GLOW ===== */
  #glow {
    position: absolute;
    /* Centered on the headlight ring */
    left: 33%;
    top: 58%;
    width: 36vmin;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.9) 0%,
      rgba(235,240,255,0.45) 30%,
      rgba(200,215,255,0.14) 55%,
      transparent 72%);
    filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  /* ===== PAGE CONTENT (revealed after) ===== */
  #content {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #fff;
    font-size: 3rem;
    opacity: 0;
  }

  /* Neumorphic-style content card */
  .card {
    padding: 3rem 4rem;
    border-radius: 24px;
    background: #0a0a0a;
    box-shadow:
      12px 12px 24px rgba(255,255,255,0.03),
      -12px -12px 24px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <div id="brand">Porsche</div>

    <div id="car-wrap">
      <img src="porsche.jpg" alt="Porsche">
      <div id="glow"></div>
    </div>
  </div>

  <!-- Your actual site content -->
  <div id="content">
    <div class="card">
      <h1>Welcome to the site 🏁</h1>
    </div>
  </div>

<script>
  const tl = gsap.timeline();

  tl
  // ===== HEADLIGHT FLICKERS TWICE =====
  .to('#glow', { opacity: 1, duration: 0.15 }, 0.4)
  .to('#glow', { opacity: 0.15, duration: 0.15 }, 0.55)
  .to('#glow', { opacity: 1, duration: 0.15 }, 0.7)
  .to('#glow', { opacity: 0, duration: 0.15 }, 0.85)
  .to('#glow', { opacity: 1, duration: 0.15 }, 1.0)    // second flicker
  .to('#glow', { opacity: 0.15, duration: 0.15 }, 1.15)
  .to('#glow', { opacity: 1, duration: 0.25 }, 1.3)    // holds bright
  .to('#glow', { opacity: 0, duration: 0.5, ease: 'power1.out' }, 2.2)
  // ===== CURTAIN LIFTS — translucent slide-up reveal =====
  .to('#preloader', {
    yPercent: -100,
    duration: 1,
    ease: 'power4.inOut'
  }, "+=0.3")
  // Content slides up from bottom with translucent blur effect
  .fromTo('#content',
    { y: '40vh', opacity: 0, filter: 'blur(12px)' },
    { y: 0, opacity: 1, filter: 'blur(0px)', duration: 1.1, ease: 'power3.out' },
    "-=0.45");
</script>
</body>
</html>
