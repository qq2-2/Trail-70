<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porsche Preloader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: Helvetica, Arial, sans-serif; background: #111; }

  /* ===== PRELOADER OVERLAY ===== */
  #preloader {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 9999;
    overflow: hidden;
  }

  /* Porsche label top-left */
  #brand {
    position: absolute;
    top: 5vh;
    left: 5vw;
    color: #fff;
    font-size: clamp(18px, 2.5vw, 32px);
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  /* ===== THE CAR (your image) ===== */
  #car-wrap {
    position: absolute;
    bottom: 25vh;
    left: -30vw;
    width: 26vw;
    min-width: 260px;
  }

  #car-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ===== HEADLIGHT GLOW ===== */
  #glow {
    position: absolute;
    /* Position tuned to the headlight in your image */
    left: 47%;
    top: 44%;
    width: 55%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.9) 0%,
      rgba(220,230,255,0.45) 30%,
      rgba(180,200,255,0.15) 55%,
      transparent 70%);
    filter: blur(6px);
    opacity: 0;          /* hidden until flicker starts */
    pointer-events: none;
    mix-blend-mode: screen;  /* blends nicely over the dark image */
  }

  /* ===== PAGE CONTENT (revealed after) ===== */
  #content {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #fff;
    font-size: 3rem;
    opacity: 0;
  }

  /* Neumorphic-style content card */
  .card {
    padding: 3rem 4rem;
    border-radius: 24px;
    background: #0a0a0a;
    box-shadow:
      12px 12px 24px rgba(255,255,255,0.03),
      -12px -12px 24px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <div id="brand">Porsche</div>

    <!-- Your Porsche image -->
    <div id="car-wrap">
      <img src="porsche.jpg" alt="Porsche">
      <div id="glow"></div>
    </div>
  </div>

  <!-- Your actual site content -->
  <div id="content">
    <div class="card">
      <h1>Welcome to the site 🏁</h1>
    </div>
  </div>

<script>
  const tl = gsap.timeline();

  tl
  // Car drives across the screen
  .fromTo('#car-wrap', { x: 0 }, { x: '130vw', duration: 3, ease: 'power1.in' }, 0)
  // ===== HEADLIGHT FLICKERS TWICE near the end of the drive =====
  .to('#glow', { opacity: 1, duration: 0.08 }, 2.1)
  .to('#glow', { opacity: 0.2, duration: 0.08 }, 2.18)
  .to('#glow', { opacity: 1, duration: 0.08 }, 2.26)
  .to('#glow', { opacity: 0, duration: 0.08 }, 2.34)
  .to('#glow', { opacity: 1, duration: 0.08 }, 2.42)   // second flicker
  .to('#glow', { opacity: 0.2, duration: 0.08 }, 2.50)
  .to('#glow', { opacity: 1, duration: 0.12 }, 2.58)
  .to('#glow', { opacity: 0, duration: 0.3, ease: 'power1.out' }, 2.9)
  // Small scale-up as the car launches off at the end
  .to('#car-wrap', { scale: 1.05, duration: 0.3, ease: 'power2.out' }, 2.7)
  // ===== CURTAIN LIFTS — translucent slide-up reveal =====
  .to('#preloader', {
    yPercent: -100,
    duration: 1,
    ease: 'power4.inOut'
  }, "+=0.2")
  // Content slides up from bottom to top with a translucent, soft feel
  .fromTo('#content',
    { y: '40vh', opacity: 0, filter: 'blur(12px)' },
    { y: 0, opacity: 1, filter: 'blur(0px)', duration: 1.1, ease: 'power3.out' },
    "-=0.45");
</script>
</body>
     </html>
