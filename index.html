<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porsche Preloader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: Helvetica, Arial, sans-serif; background: #111; }

  /* ===== PRELOADER OVERLAY ===== */
  #preloader {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 9999;
    overflow: hidden;
  }

  /* Big counter bottom-right */
  #counter {
    position: absolute;
    bottom: 4vh;
    right: 5vw;
    font-size: clamp(60px, 12vw, 180px);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  #counter::after {
    content: "%";
    font-size: 0.35em;
    vertical-align: top;
    color: #d5001c;
  }

  /* Porsche label top-left */
  #brand {
    position: absolute;
    top: 5vh;
    left: 5vw;
    color: #fff;
    font-size: clamp(18px, 2.5vw, 32px);
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  /* ===== THE CAR (your image) ===== */
  #car-wrap {
    position: absolute;
    bottom: 18vh;
    left: -30vw;   /* starts off-screen left */
    width: 26vw;
    min-width: 260px;
  }

  #car-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Road line */
  #road {
    position: absolute;
    bottom: 15vh;
    left: 0;
    width: 200%;
    height: 2px;
    background: repeating-linear-gradient(90deg, #555 0 40px, transparent 40px 80px);
    animation: roadmove 0.4s linear infinite;
  }
  @keyframes roadmove { to { transform: translateX(-80px); } }

  /* ===== PAGE CONTENT (revealed after) ===== */
  #content {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f4;
    color: #111;
    font-size: 3rem;
    opacity: 0;
  }
</style>
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <div id="brand">Porsche</div>

    <!-- Your Porsche image -->
    <div id="car-wrap">
      <img src="porsche.jpg" alt="Porsche">
    </div>

    <div id="road"></div>
    <div id="counter">0</div>
  </div>

  <!-- Your actual site content -->
  <div id="content">
    <h1>Welcome to the site 🏁</h1>
  </div>

<script>
  // --- Counter 0 -> 100 ---
  const counter = document.getElementById('counter');
  const countObj = { val: 0 };

  const tl = gsap.timeline();

  tl.to(countObj, {
    val: 100,
    duration: 3,
    ease: "power2.inOut",
    onUpdate: () => counter.textContent = Math.round(countObj.val)
  })
  // Car drives across the screen during loading
  .fromTo('#car-wrap', { x: 0 }, { x: '130vw', duration: 3, ease: 'none' }, 0)
  // Small scale-up as the car launches off at the end
  .to('#car-wrap', { scale: 1.05, duration: 0.3, ease: 'power2.out' }, 2.7)
  // Curtain lifts, revealing the site
  .to('#preloader', {
    yPercent: -100,
    duration: 0.9,
    ease: 'power4.inOut'
  }, "+=0.2")
  // Content fades in
  .to('#content', { opacity: 1, duration: 0.8 }, "-=0.4");
</script>
</body>
</html>
